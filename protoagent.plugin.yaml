id: data
name: Data Analyst
version: 0.1.4
description: >-
  Local-first data analysis — your agent, your data, your way. Point the agent at CSV, TSV,
  Parquet, JSON, Excel and SQLite files (or folders of them) inside folders the operator
  allowlists; it explores them with READ-ONLY SQL on an embedded DuckDB that queries the files
  in place (no server, no import step), profiles them, exports results to the workspace, and
  charts them in the console's Artifact panel as live, themed Vega-Lite charts. The model writes
  a few lines of SQL and a small spec; the plugin inlines the rows, so a chart lands in seconds.
  Adds seven data_* tools and two skills.
# Provenance (ADR 0027) — shown in the install review when added by git URL.
repository: "https://github.com/protoLabsAI/data-plugin"
guide_url: "https://github.com/protoLabsAI/data-plugin#quick-start"
# 0.192.0 ships the `vega-lite` artifact kind and the `artifact.show` plugin service
# (graph.sdk.service, ADR 0116) that data_chart renders through. On an older core every tool
# but data_chart works, and data_chart says why it couldn't render.
min_protoagent_version: "0.192.0"

# Declarative posture (ADR 0071). No outbound calls, no credentials: DuckDB runs with external
# access OFF (no httpfs, no extension installs), and the only files it can open are the
# connected sources inside `data_dirs` plus this plugin's own cache. Writes go only to this
# plugin's store (registry + Parquet snapshots of SQLite/Excel) and the workspace's
# data-exports/ folder.
capabilities:
  network: []
  filesystem: scoped
enabled: false              # author default — operators opt in via plugins.enabled

# Declared, NOT auto-installed (ADR 0027 D4).
# duckdb (MIT) is the engine. It is deliberately NOT `scope: host`: the packaged desktop app's
# host is a frozen binary that can't take a compiled dependency, and refuses a hard host-scoped
# one outright. So duckdb is a runtime dep — on the desktop it installs into the managed Python
# runtime and `engine` runs each query there as a worker (`duck.py`); on a source/server install
# it installs into the host's environment and runs in-process. openpyxl (MIT) only reads .xlsx,
# in-process — optional, and connecting a workbook without it says how to install it.
requires_pip:
  - { pkg: "duckdb>=1.4,<2", scope: runtime }
  - { pkg: "openpyxl>=3.1", optional: true, scope: host }

config_section: data
config:
  data_dirs: ""             # extra folders the agent may connect files from (comma/newline separated)
  use_default_folder: true  # also allowlist the agent's own data folder, <workspace>/data (created on load)
  row_cap: 200              # rows a data_query reply shows before truncating
  chart_row_cap: 5000       # rows a data_chart may inline (aggregate in SQL past this)
  timeout_s: 20             # per-query time cap (seconds)
  memory_limit: "1GB"       # DuckDB memory limit per query
  export_row_cap: 1000000   # rows a data_export may write
# `spawns: true` marks a setting the agent's own set_config tool refuses to write (protoAgent
# ADR 0019 §3b) — core's only per-key operator-only fence. `data_dirs` carries it for the same
# reason campaign's `upload_dirs` does: it decides which local files the agent may READ (and
# then quote back into the conversation or an export) — an exfiltration path — so the agent must
# never widen it itself. `timeout_s` and `memory_limit` carry it too: they bound how long a query
# runs and how much it holds (and spills — spill is also hard-capped at 1 GB), so the agent can't
# lift them to grind the host. Both are clamped in code as well. Older cores ignore the field.
# `use_default_folder` carries it too: it's part of the read scope (the agent's own
# <workspace>/data, the one folder inside the agent home the fence lets it read).
# `multiple: true` on `data_dirs` (protoAgent after 0.192.0) renders the setting as a list of
# folders, each with its own Browse…; it is still saved as ONE string (newline-joined), which
# fence.py already splits on commas and newlines. Older cores ignore the key and show the single
# path box — same value, so no min_protoagent_version bump.
settings:
  - { key: data_dirs, label: "Data folders", type: path, path_kind: dir, multiple: true, spawns: true, group: "Data Analyst", description: "Optional — the agent already has its own data folder (<workspace>/data; data_sources shows the path), so drop files there or list more folders here, one row per folder (Browse… on each, Add folder for another; an older protoAgent shows one box: separate folders with commas or new lines) (symlinks resolved; a file must really live inside one). Credential files and dirs (.env, *.pem, .ssh, …) and the rest of the agent's home (~/.protoagent) are refused even inside these; the filesystem root, your home dir or a parent of it, and the agent's home are ignored as too broad. Queries are read-only: nothing in these folders is ever written. Operator-only: the agent can't widen it." }
  - { key: use_default_folder, label: "Use the default data folder", type: bool, spawns: true, group: "Data Analyst", description: "Allowlist the agent's own data folder, <workspace>/data (created on load) — the one folder inside the agent's home it may read; everything else there stays refused. Off: only the Data folders above. Exports never land in it. Operator-only: the agent can't toggle it." }
  - { key: row_cap, label: "Rows per query reply", type: number, group: "Data Analyst", description: "How many rows data_query shows before truncating (the agent is told to aggregate or LIMIT)." }
  - { key: chart_row_cap, label: "Rows per chart", type: number, group: "Data Analyst", description: "Most rows a chart may carry. Past this data_chart refuses and asks for an aggregated query." }
  - { key: timeout_s, label: "Query time limit (s)", type: number, spawns: true, group: "Data Analyst", description: "A query running longer than this is interrupted (at most 120 s). Operator-only: the agent can't raise it." }
  - { key: memory_limit, label: "Query memory limit", type: string, spawns: true, group: "Data Analyst", description: "DuckDB memory limit per query, e.g. 1GB or 512MB. Larger work spills to the plugin's private temp folder, capped at 1 GB of disk. Clamped to 64 MB–8 GB; an unreadable value uses 1 GB. Operator-only: the agent can't raise it." }
  - { key: export_row_cap, label: "Rows per export", type: number, group: "Data Analyst", description: "Most rows data_export writes to a file." }
