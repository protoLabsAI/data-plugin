name: CI

# Lint + test the plugin, host-free. Dependencies are PINNED: uv.lock is the source of truth
# and `uv sync --frozen` installs exactly it (a stale lock fails here instead of resolving
# something new). After changing pyproject.toml, run `uv lock` and commit uv.lock. Runs on a
# GitHub-hosted runner (ubuntu-latest).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked deps
        run: uv sync --frozen --python 3.12

      - name: Lint
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .

      - name: Test
        # Includes the dependency licence check (tests/test_plugin.py::
        # test_dependency_licences_are_permissive): the declared pip deps must stay permissive
        # (duckdb MIT, openpyxl MIT). -rs prints skip reasons.
        run: uv run --frozen pytest -q -rs

      - name: Test through the out-of-process engine
        # The desktop app runs DuckDB in the managed Python runtime (engine.call → duck.py), not
        # in-process. Re-run the whole suite over that transport so the two can never drift.
        run: DATA_TEST_WORKER=1 uv run --frozen pytest -q
